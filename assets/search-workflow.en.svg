<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">From a query to evidence you can review</title>
<desc id="desc">The runtime prepares locally. Host web tools send terms to the engine. Selected sources are preserved and examined in a local case.</desc>
<rect width="960" height="320" rx="18" fill="#151B24"/>
<g font-family="Arial, sans-serif">
<text x="28" y="42" font-size="25" fill="#F5F3ED" font-weight="700">From a query to evidence you can review</text>
<rect x="24" y="68" width="288" height="184" rx="12" fill="#202936"/>
<rect x="24" y="86" width="4" height="148" rx="2" fill="#E7A86E"/>
<text x="42" y="96" font-size="14" fill="#E7A86E" font-weight="700">01 · LOCAL</text>
<text x="42" y="134" font-size="27" fill="#F5F3ED" font-weight="700">Prepare</text>
<text x="42" y="169" font-size="18" fill="#F5F3ED" font-weight="400">dorks / forge_dorks</text>
<text x="42" y="199" font-size="16" fill="#C7D0DD" font-weight="400">Phrase, site, type, dates</text>
<text x="42" y="229" font-size="17" fill="#C7D0DD" font-weight="400">Query + Google URL</text>
<path d="M318 152l8 8-8 8" fill="none" stroke="#C7D0DD" stroke-width="2"/>
<rect x="336" y="68" width="288" height="184" rx="12" fill="#202936"/>
<rect x="336" y="86" width="4" height="148" rx="2" fill="#76B9F0"/>
<text x="354" y="96" font-size="14" fill="#76B9F0" font-weight="700">02 · HOST WEB TOOLS</text>
<text x="354" y="134" font-size="27" fill="#F5F3ED" font-weight="700">Search</text>
<text x="354" y="169" font-size="18" fill="#F5F3ED" font-weight="400">Search tool or browser</text>
<text x="354" y="199" font-size="16" fill="#C7D0DD" font-weight="400">Actual engine identified</text>
<text x="354" y="229" font-size="17" fill="#C7D0DD" font-weight="400">Query and date recorded</text>
<path d="M630 152l8 8-8 8" fill="none" stroke="#C7D0DD" stroke-width="2"/>
<rect x="648" y="68" width="288" height="184" rx="12" fill="#202936"/>
<rect x="648" y="86" width="4" height="148" rx="2" fill="#80D1B0"/>
<text x="666" y="96" font-size="14" fill="#80D1B0" font-weight="700">03 · LOCAL CASE</text>
<text x="666" y="134" font-size="27" fill="#F5F3ED" font-weight="700">Verify</text>
<text x="666" y="169" font-size="18" fill="#F5F3ED" font-weight="400">Selected original sources</text>
<text x="666" y="199" font-size="16" fill="#C7D0DD" font-weight="400">Evidence and references kept</text>
<text x="666" y="229" font-size="17" fill="#C7D0DD" font-weight="400">Observations and limits</text>
<text x="28" y="282" font-size="18" fill="#C7D0DD" font-weight="400">The engine receives search terms. Local preparation does not run a search.</text>
</g>
</svg>
